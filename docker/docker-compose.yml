version: '3.8'
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/attendance_db
      - JWT_SECRET=change_this_in_production
      - JWT_REFRESH_SECRET=change_this_refresh_in_production
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGIN=http://localhost:3000
      - RUN_SEED=false
    depends_on:
      - mongo
    command: ["./entrypoint.sh"]

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - ../frontend:/app/frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api/v1
    command: sh -c "npm ci && npm start"

volumes:
  mongo-data:
